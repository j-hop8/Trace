[project]
name = "trace-pipeline"
version = "0.1.0"
description = "Earth Engine extraction pipeline for Trace — Taiwan change features"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.4",
    "geemap>=0.35",
    "geopandas>=1.0",
    "shapely>=2.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
trace = "trace_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trace_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
