name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The basemap may not use blue or green — those hues mean "water domain" and "forest
      # domain". Invisible in review, so it is checked mechanically.
      - run: npm run check:palette
      - run: npm run build

  pipeline:
    name: pipeline · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # No Earth Engine credentials in CI, and none needed: the tests cover the schema, the
      # domain contract, and the constants. Anything that actually talks to EE is a manual
      # extraction step, not something a pull request should be able to trigger.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
